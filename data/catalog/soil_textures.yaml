# USDA soil texture classes.
# theta_* are volumetric water contents in m3/m3, written as decimal strings.
# theta_fc and theta_wp are the midpoint of theta_*_min and theta_*_max.
# Source: Allen R.G., Pereira L.S., Raes D., Smith M. (1998). Crop evapotranspiration.
# FAO Irrigation and Drainage Paper 56, Table 19 (typical soil water characteristics).
# sandy_clay_loam, clay_loam and sandy_clay are not in Table 19:
# all theta values are null and citation is null.
soil_textures:
  - code: sand
    sort: 1
    name:
      fr: "Sable"
      ar: "رملية"
      en: "Sand"
    theta_fc_min: "0.070"
    theta_fc_max: "0.170"
    theta_wp_min: "0.020"
    theta_wp_max: "0.070"
    theta_fc: "0.120"
    theta_wp: "0.045"
    citation: "Allen R.G., Pereira L.S., Raes D., Smith M. (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56, Table 19 (typical soil water characteristics); typical value = midpoint of the range."
  - code: loamy_sand
